[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { version = "0.1.0", path = "../common" }
gloo-net = "0.7.0"
wasm-bindgen = "0.2.121"
yew = { version = "0.23.0", features = ["csr"] }
serde.workspace = true
wasm-bindgen-futures = "0.4.71"
yew-router = "0.20.0"

web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "DomTokenList",
] }

js-sys = "0.3"